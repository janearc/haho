version: v2
# Each proto's go_package places its output under gen/<pkg>/ (e.g. gen/harnesspb).
# module= strips the module prefix so files land at gen/, not gen/github.com/...
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/janearc/haho
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/janearc/haho
