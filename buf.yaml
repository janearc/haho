version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The service intentionally uses google.protobuf.Empty request bodies and
    # reuses SubmitResponse across Submit and StreamSubmit.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
