syntax = "proto3";

package haho.filter.v1;

option go_package = "github.com/janearc/haho/gen/hahopb";

enum FilterType {
  RTK = 0;
  PASSTHROUGH = 1;
  LOGGER = 2;
  CUSTOM = 3;
}

message FilterConfig {
  string name = 1;
  FilterType type = 2;
  map<string, string> params = 3;
}

message FilterPipelineConfig {
  repeated FilterConfig filters = 1;
}

message FilterRequest {
  string content = 1;
  map<string, string> metadata = 2;
}

message FilterResponse {
  string content = 1;
  map<string, string> metadata = 2;
  bool modified = 3;
}
