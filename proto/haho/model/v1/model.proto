syntax = "proto3";

package haho.model.v1;

option go_package = "github.com/janearc/haho/gen/modelpb;modelpb";

import "haho/common/v1/common.proto";

enum ModelProvider {
  MODEL_PROVIDER_UNSPECIFIED = 0;
  MODEL_PROVIDER_LOCAL = 1;
  MODEL_PROVIDER_OPUS = 2;
  MODEL_PROVIDER_DEEPSEEK = 3;
}

message ModelConfig {
  ModelProvider provider = 1;
  string endpoint = 2;
  string model_name = 3;
  string api_key_env = 4;
  map<string, string> params = 5;
}

message GenerateRequest {
  repeated haho.common.v1.ChatMessage messages = 1;
  ModelConfig config = 2;
  map<string, string> params = 3;
}

message GenerateResponse {
  string content = 1;
  int32 tokens_used = 2;
  string model = 3;
  bool cached = 4;
  map<string, string> metadata = 5;
}
