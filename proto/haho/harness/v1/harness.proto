syntax = "proto3";

package haho.harness.v1;

option go_package = "github.com/janearc/haho/gen/harnesspb;harnesspb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "haho/common/v1/common.proto";
import "haho/filter/v1/filter.proto";

message SubmitRequest {
  repeated haho.common.v1.ChatMessage messages = 1;
  string model_override = 2;
  map<string, string> params = 3;
}

message SubmitResponse {
  string content = 1;
  int32 tokens_used = 2;
  string model = 3;
  bool cached = 4;
  map<string, string> metadata = 5;
}

enum HarnessState {
  HARNESS_STATE_UNSPECIFIED = 0;
  HARNESS_STATE_IDLE = 1;
  HARNESS_STATE_BUSY = 2;
  HARNESS_STATE_WAITING_SUBPROCESS = 3;
  HARNESS_STATE_WAITING_INPUT = 4;
}

message HealthResponse {
  HarnessState state = 1;
  string state_description = 2;
  string model_name = 3;
  int64 uptime_seconds = 4;
  string message = 5;
  google.protobuf.Timestamp last_updated = 6;
}

message ConfigResponse {
  string config_json = 1;
}

message SetFilterRequest {
  haho.filter.v1.FilterStage stage = 1;
  repeated haho.filter.v1.FilterConfig filters = 2;
}

message SetFilterResponse {
  bool success = 1;
  string message = 2;
}

service HarnessService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc StreamSubmit(SubmitRequest) returns (stream SubmitResponse);
  rpc GetHealth(google.protobuf.Empty) returns (HealthResponse);
  rpc GetConfig(google.protobuf.Empty) returns (ConfigResponse);
  rpc SetFilter(SetFilterRequest) returns (SetFilterResponse);
}
