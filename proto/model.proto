syntax = "proto3";

package haho.model.v1;

option go_package = "github.com/janearc/haho/gen/hahopb";

enum ModelProvider {
  LOCAL = 0;
  OPUS = 1;
  DEEPSEEK = 2;
}

message ModelConfig {
  ModelProvider provider = 1;
  string endpoint = 2;
  string model_name = 3;
  string api_key_env = 4;
  map<string, string> params = 5;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  repeated ChatMessage messages = 1;
  ModelConfig config = 2;
  map<string, string> params = 3;
}

message GenerateResponse {
  string content = 1;
  int32 tokens_used = 2;
  string model = 3;
  bool cached = 4;
  map<string, string> metadata = 5;
}
